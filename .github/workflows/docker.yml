name: docker

# Builds the CUDA/nsys/NCCL training image and publishes it to GitHub Container
# Registry. Pull requests build but do not push, so forks stay safe.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Catches Dockerfile mistakes in seconds instead of after a 20-minute build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          call: check

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: nccl-tests
            suffix: "-nccl"
    steps:
      - uses: actions/checkout@v4

      # A CUDA devel base plus the cu13 torch stack lands well over 20 GB
      # unpacked, which overruns a stock runner. Reclaim what we can first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      # metadata-action lowercases the names it generates, but the cache refs are
      # built here by hand and GHCR rejects any uppercase in a repository name --
      # so derive one lowercase name and use it for both.
      - name: Resolve image name
        id: image
        run: |
          echo "name=$REGISTRY/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache rather than type=gha: the GitHub Actions cache caps
          # out at 10 GB per repo, which this image blows through immediately.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache${{ matrix.suffix }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache{1},mode=max', steps.image.outputs.name, matrix.suffix) || '' }}
          # Keeps the package listing free of "unknown/unknown" attestation rows.
          provenance: false

name: docker

# Builds the CUDA/nsys/NCCL training image and publishes it to GitHub Container
# Registry. Pull requests build but do not push, so forks stay safe.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .python-version
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Catches Dockerfile mistakes in seconds instead of after a 20-minute build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          call: check

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            suffix: ""
            title: scale-transformer
            description: >-
              CUDA 13 training image for scale-transformer: nvcc, Nsight Systems
              (nsys), system NCCL and the locked torch/transformers stack.
          - target: nccl-tests
            suffix: "-nccl"
            title: scale-transformer-nccl
            description: >-
              The scale-transformer runtime image plus NVIDIA nccl-tests
              (all_reduce_perf and friends) on PATH, for benchmarking collectives.
    steps:
      - uses: actions/checkout@v4

      # A CUDA devel base plus the cu13 torch stack lands well over 20 GB
      # unpacked, which overruns a stock runner. Reclaim what we can first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      # metadata-action lowercases the names it generates, but the cache refs are
      # built here by hand and GHCR rejects any uppercase in a repository name --
      # so derive one lowercase name and use it for both.
      - name: Resolve image name
        id: image
        run: |
          echo "name=$REGISTRY/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Default is manifest-only; index level is what a multi-arch push would
          # carry, so emit both and stay correct if `platforms` ever grows.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          # metadata-action already derives created/revision/version and, from the
          # repo, source/url/title/description. `source` is the one that makes
          # GHCR link the package to this repo and inherit its visibility, so it
          # is left alone. These override the rest: the repo-derived title and
          # description are identical for both matrix legs, which would leave the
          # two packages indistinguishable in the GHCR listing.
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Labels land in the image config, so every tag above that resolves to
          # this image carries them. Annotations are the manifest-level copy that
          # a registry can read without pulling the config blob.
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Registry cache rather than type=gha: the GitHub Actions cache caps
          # out at 10 GB per repo, which this image blows through immediately.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache${{ matrix.suffix }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache{1},mode=max', steps.image.outputs.name, matrix.suffix) || '' }}
          # Keeps the package listing free of "unknown/unknown" attestation rows.
          provenance: false

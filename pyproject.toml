[project]
name = "scale-transformer"
version = "0.1.0"
description = "Baseline for scaling fine-tune model Qwen3-30B-A3B"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.6",
    "transformers>=5.0,<6",
    "datasets>=3.0",
    "accelerate>=1.2",
    "peft>=0.14",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "torchtitan>=0.2.2",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.45; sys_platform == 'linux'"]
track = ["tensorboard>=2.16"]
dev = ["ruff>=0.7", "pytest>=8.0"]

[project.scripts]
scale-train = "scale_transformer.cli:main"
scale-merge = "scale_transformer.merge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scale_transformer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# flash-attn needs a compiler + CUDA toolkit and is never installed by default.
# On a GPU box:  uv pip install flash-attn --no-build-isolation
#
# Dependencies-only project: there is no source tree to install right now, so uv
# resolves and installs the dependencies without building this package itself.
# Restore src/ and flip this back to `true` to get the scale-train/scale-merge
# entry points installed again.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

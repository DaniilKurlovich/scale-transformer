# Smoke test: same code path, a model small enough to run on a laptop (CPU or MPS).
# 20 steps on 256 examples -- proves the pipeline, not the recipe.

model:
  name_or_path: Qwen/Qwen3-0.6B
  dtype: float32
  attn_implementation: eager
  gradient_checkpointing: false
  output_router_logits: false
  router_aux_loss_coef: null

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  dataset_name: tatsu-lab/alpaca
  format: alpaca
  max_seq_len: 512
  max_train_samples: 256
  max_eval_samples: 16
  enable_thinking: false
  num_proc: 1

train:
  output_dir: outputs/qwen3-0.6b-smoke
  max_steps: 20
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  warmup_steps: 0.0
  bf16: false
  logging_steps: 1
  save_strategy: "no"
  eval_strategy: "no"
  report_to: []

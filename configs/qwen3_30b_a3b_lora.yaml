# Qwen3-30B-A3B (30.5B total / 3.3B active, 128 experts, top-8) -- LoRA SFT on one GPU.
# Fits an 80 GB H100/A100: ~61 GB bf16 weights + activations with grad checkpointing.
# On 48 GB or less, switch to configs/qwen3_30b_a3b_qlora.yaml.

model:
  name_or_path: Qwen/Qwen3-30B-A3B
  dtype: bfloat16
  attn_implementation: sdpa     # flash_attention_2 once the wheel is installed
  gradient_checkpointing: true
  output_router_logits: true    # MoE load-balancing loss
  router_aux_loss_coef: 0.001

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  target_expert_mlp: false

data:
  dataset_name: tatsu-lab/alpaca
  format: alpaca
  train_split: train
  eval_fraction: 0.01
  max_seq_len: 2048
  train_on_completions_only: true
  enable_thinking: false
  max_eval_samples: 256

train:
  output_dir: outputs/qwen3-30b-a3b-lora
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16   # effective batch 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03
  bf16: true
  optim: adamw_torch
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  report_to: [tensorboard]
